name: Feature request
description: Propose a focused cartographic-pattern capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Cartographic use case
      description: What map or symbology problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include examples or references to QGIS, ArcGIS, or another established convention.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Likely API surface
      options:
        - Stable core
        - MapLibre integration
        - Experimental
        - Unsure
    validations:
      required: true
